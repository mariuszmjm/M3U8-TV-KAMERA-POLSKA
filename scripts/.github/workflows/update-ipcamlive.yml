name: TEST IPCamLive 249 + zapis do repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-ipcamlive-249:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Zainstaluj requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test 249 kamer IPCamLive
        run: |
          python scripts/test_ipcamlive_249.py

      - name: Utwórz folder ipcamlive
        run: |
          mkdir -p ipcamlive

      - name: Skopiuj wyniki do folderu ipcamlive
        run: |
          cp ipcamlive_results/ipcamlive_online.m3u8 ipcamlive/ipcamlive_online.m3u8
          cp ipcamlive_results/ipcamlive_online.csv ipcamlive/ipcamlive_online.csv
          cp ipcamlive_results/ipcamlive_wyniki_wszystkie.csv ipcamlive/ipcamlive_wyniki_wszystkie.csv

      - name: Pokaż liczbę działających kamer
        run: |
          echo "============================================"
          echo "DZIAŁAJĄCE KAMERY IPCAMLIVE"
          echo "============================================"

          LICZBA=$(grep -c "^#EXTINF" ipcamlive/ipcamlive_online.m3u8 || true)

          echo "Liczba kamer ONLINE: $LICZBA"

          echo ""
          echo "Pliki zapisane w folderze ipcamlive:"
          ls -lh ipcamlive/

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ipcamlive/ipcamlive_online.m3u8
          git add ipcamlive/ipcamlive_online.csv
          git add ipcamlive/ipcamlive_wyniki_wszystkie.csv

          if git diff --cached --quiet; then
            echo "Brak zmian - nic do zapisania."
          else
            git commit -m "Aktualizacja kamer IPCamLive"
            git push
          fi

      - name: Zapisz również artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipcamlive-249-wyniki
          path: ipcamlive_results/
          if-no-files-found: warn
