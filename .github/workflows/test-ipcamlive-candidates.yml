name: TEST IPCamLive candidates

on:
  workflow_dispatch:

jobs:
  test-ipcamlive-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Zainstaluj requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test kandydatów IPCamLive
        run: python scripts/test_ipcamlive_candidates.py
