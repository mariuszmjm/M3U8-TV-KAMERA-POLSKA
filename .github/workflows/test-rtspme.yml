name: TEST RTSP.ME

on:
  workflow_dispatch:

jobs:
  test-rtspme:
    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Zainstaluj Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test RTSP.ME
        run: python scripts/test_rtspme.py
