name: Odśwież ForecastWeather

on:
  workflow_dispatch:

  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: update-forecastweather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Odśwież ForecastWeather
        run: python scripts/update_forecastweather.py

      - name: Zapisz nową wersję M3U
        run: |
          if git diff --quiet; then
            echo "Brak zmian."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8
          git commit -m "Odświeżenie ForecastWeather"

          git pull --rebase origin main
          git push
