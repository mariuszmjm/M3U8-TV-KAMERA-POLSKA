name: Aktualizacja RTSP.ME

on:
  workflow_dispatch:

  schedule:
    - cron: "43 * * * *"

permissions:
  contents: write

concurrency:
  group: update-rtspme
  cancel-in-progress: false

jobs:
  update-rtspme:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Zainstaluj Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sprawdź i aktualizuj RTSP.ME
        run: python scripts/update_rtspme.py

      - name: Zapisz zmiany
        run: |
          if git diff --quiet; then
            echo "Brak zmian RTSP.ME."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8
          git commit -m "Automatyczna aktualizacja RTSP.ME"

          git pull --rebase origin main
          git push
