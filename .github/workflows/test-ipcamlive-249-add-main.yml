name: TEST IPCamLive 249 + dodaj do Kamery-pogodowe

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: ipcamlive-249-main
  cancel-in-progress: false

jobs:
  ipcamlive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Zainstaluj requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test 249 kamer IPCamLive
        run: python scripts/test_ipcamlive_249.py

      - name: Pobierz najnowszy stan repozytorium
        run: git pull --rebase origin main

      - name: Utwórz folder ipcamlive
        run: mkdir -p ipcamlive

      - name: Skopiuj wyniki IPCamLive do repo
        run: |
          cp ipcamlive_results/ipcamlive_online.m3u8 ipcamlive/ipcamlive_online.m3u8
          cp ipcamlive_results/ipcamlive_online.csv ipcamlive/ipcamlive_online.csv
          cp ipcamlive_results/ipcamlive_wyniki_wszystkie.csv ipcamlive/ipcamlive_wyniki_wszystkie.csv

      - name: Dodaj działające kamery do Kamery-pogodowe.m3u8
        run: python scripts/merge_ipcamlive_to_main.py

      - name: Pokaż wynik
        run: |
          echo "Liczba kamer ONLINE:"
          grep -c "^#EXTINF" ipcamlive/ipcamlive_online.m3u8 || true
          echo ""
          echo "Łączna liczba wpisów w Kamery-pogodowe.m3u8:"
          grep -c "^#EXTINF" Kamery-pogodowe.m3u8 || true

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8
          git add ipcamlive/ipcamlive_online.m3u8
          git add ipcamlive/ipcamlive_online.csv
          git add ipcamlive/ipcamlive_wyniki_wszystkie.csv

          if git diff --cached --quiet; then
            echo "Brak zmian - nic do zapisania."
          else
            git commit -m "Automatyczna aktualizacja 249 kamer IPCamLive"

            for PROBA in 1 2 3; do
              echo "Próba wysłania zmian: $PROBA/3"

              if git pull --rebase origin main && git push; then
                echo "Zmiany zapisane w repozytorium."
                exit 0
              fi

              sleep 5
            done

            echo "Nie udało się wysłać zmian po 3 próbach."
            exit 1
          fi

      - name: Zapisz wyniki jako artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipcamlive-249-wyniki
          path: ipcamlive_results/
          if-no-files-found: warn
