name: LG weather pilot
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - 'test/lg-weather/weather.js'
      - 'test/lg-weather/generate.cjs'
      - '.github/workflows/update-lg-weather.yml'
permissions:
  contents: write
concurrency:
  group: lg-weather-pilot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/lg-weather/generate.cjs --test
      - run: node test/lg-weather/generate.cjs
      - name: Commit weather cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/lg-weather/cards/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update LG weather pilot cards"
          git pull --rebase origin main
          git push origin HEAD:main
