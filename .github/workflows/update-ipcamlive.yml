name: Aktualizacja IPCamLive

on:
  workflow_dispatch:

  schedule:
    - cron: "3/5 * * * *"

permissions:
  contents: write

jobs:
  update-ipcamlive:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pobierz aktualny adres IPCamLive
        run: python scripts/update_ipcamlive.py

      - name: Zapisz zmiany
        run: |
          if git diff --quiet; then
            echo "Adres IPCamLive nie zmienił się."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8
          git commit -m "Automatyczna aktualizacja IPCamLive"
          git push
