name: Aktualizacja IPCamLive

on:
  push:
    paths:
      - '.github/workflows/update-ipcamlive.yml'
      - 'scripts/update_ipcamlive.py'
  workflow_dispatch:

  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

jobs:
  update-ipcamlive:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Zainstaluj requests
        run: pip install requests

      - name: Pobierz aktualny adres IPCamLive
        run: python scripts/update_ipcamlive.py

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8 ipcamlive/kontrola_playlisty.csv
          git diff --cached --quiet && exit 0
          git commit -m "Automatyczna aktualizacja IPCamLive"
          git pull --rebase origin main && git push
