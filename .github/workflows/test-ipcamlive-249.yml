name: TEST IPCamLive 249

on:
  workflow_dispatch:

jobs:
  test-ipcamlive-249:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Zainstaluj requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test 249 kamer IPCamLive
        run: python scripts/test_ipcamlive_249.py

      - name: Zapisz wyniki jako artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipcamlive-249-wyniki
          path: ipcamlive_results/
          if-no-files-found: warn
