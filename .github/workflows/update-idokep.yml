name: Aktualizacja Idokep

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: update-idokep
  cancel-in-progress: false

jobs:
  update-idokep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Zainstaluj biblioteki
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Sprawdź i aktualizuj Idokep
        run: python scripts/update_idokep.py

      - name: Zapisz zmiany
        run: |
          if git diff --quiet; then
            echo "Brak zmian Idokep."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Kamery-pogodowe.m3u8
          git commit -m "Automatyczna aktualizacja Idokep"

          git pull --rebase origin main
          git push
