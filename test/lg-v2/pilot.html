<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test pilota LG</title><style>body{background:#101820;color:white;font:24px Arial,sans-serif;padding:24px}button,a{font:inherit;color:white;background:#24394b;padding:12px;border-radius:6px;border:1px solid #aaa}button:focus,a:focus,#area:focus{outline:4px solid #ffcf45}#area{padding:25px;background:#24394b;margin:20px 0;min-height:100px}pre{font-size:20px;white-space:pre-wrap;color:#b5f6d2}</style></head><body><h1>Test pilota LG</h1><p>Wybierz pole testowe i naciśnij kolejno ↑, ↓, P+, P− oraz kolorowe przyciski. Każde zdarzenie odebrane przez przeglądarkę pojawi się poniżej. Nic nie jest wysyłane do sieci.</p><button id="clear">Wyczyść wyniki</button> <a href="./">Powrót do odtwarzacza</a><div id="area" tabindex="0">Pole testowe – naciśnij przycisk pilota.</div><p id="count">Odebrane zdarzenia: 0</p><pre id="log">Brak zdarzeń.</pre><script>(function(){var n=0,rows=[],area=document.getElementById('area'),log=document.getElementById('log'),count=document.getElementById('count');function record(e){n++;rows.unshift(e.type+' | key: '+(e.key||'–')+' | code: '+(e.code||'–')+' | keyCode: '+(e.keyCode||e.which||0));rows=rows.slice(0,16);log.textContent=rows.join('\n');count.textContent='Odebrane zdarzenia: '+n;if(document.activeElement===area)e.preventDefault()}window.addEventListener('keydown',record,true);window.addEventListener('keyup',record,true);document.getElementById('clear').onclick=function(){n=0;rows=[];log.textContent='Brak zdarzeń.';count.textContent='Odebrane zdarzenia: 0';area.focus()};area.onclick=function(){area.focus()};area.focus()})();</script></body></html>
