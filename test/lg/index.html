<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamery pogodowe – test LG</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:white;font:20px Arial,sans-serif}header{padding:12px}button,select{font:inherit;padding:10px;background:#24394b;color:white;border:1px solid #789;border-radius:5px;margin:3px}button:focus,select:focus{outline:4px solid #ffcf45}#stage{position:relative;background:black;width:100%;height:70vh;overflow:hidden}video{width:100%;height:100%;object-fit:contain}#weather{position:absolute;right:2%;top:3%;width:25%;max-height:65%;object-fit:contain;object-position:top right;pointer-events:none;background:rgba(255,255,255,.85);border-radius:6px}#stage:fullscreen{width:100%;height:100%}#stage.full{position:fixed;inset:0;width:100%;height:100%;z-index:10}#status{padding:10px;font-size:16px}#name{position:absolute;bottom:3%;left:2%;background:#000b;padding:8px;pointer-events:none}
</style></head><body><header><strong>Kamery pogodowe – test LG</strong><br><select id="cam" aria-label="Kamera"></select><button id="play">Odtwórz</button><button id="mode">Tryb: natywny</button><button id="full">Pełny ekran</button><button id="size">Pogoda: 25%</button><button id="toggle">Pogoda wł./wył.</button></header><div id="stage"><video id="video" playsinline muted autoplay></video><img id="weather" alt="Pogoda"><span id="name"></span></div><div id="status" role="status">Pobieranie playlisty…</div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)}, v=$('video'), select=$('cam'), weather=$('weather'), stage=$('stage'), items=[], hls=null, native=true, sizes=[18,25,35,45], sz=1, hidden=false, selected=null, attempt=0;
function status(s){$('status').textContent=s}
function parse(s){var out=[], current=null;s.split(/\r?\n/).forEach(function(raw){var l=raw.trim();if(l.indexOf('#EXTINF:')===0){var m=l.match(/tvg-logo="([^"]*)"/i);var g=l.match(/group-title="([^"]*)"/i);current={name:l.substring(l.indexOf(',')+1).trim(),logo:m?m[1]:'',group:g?g[1]:''}}else if(current&&/^https?:\/\//i.test(l)){current.url=l;out.push(current);current=null}});return out}
function image(){if(!selected||!selected.logo){weather.style.display='none';return}weather.style.display=hidden?'none':'block';weather.src=selected.logo+(selected.logo.indexOf('?')<0?'?':'&')+'refresh='+Math.floor(Date.now()/600000)}
weather.onerror=function(){weather.style.display='none';status('Grafika pogodowa niedostępna; transmisja może nadal działać.')};
function start(){var item=items[Number(select.value)];if(!item)return;selected=item;attempt++;var token=attempt;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();$('name').textContent=item.name;image();status('Łączenie: '+item.name+' – '+(native?'HLS natywny':'HLS.js'));if(!native&&window.Hls&&Hls.isSupported()&&/\.m3u8/i.test(item.url)){hls=new Hls();hls.attachMedia(v);hls.on(Hls.Events.MEDIA_ATTACHED,function(){if(token===attempt)hls.loadSource(item.url)});hls.on(Hls.Events.ERROR,function(e,d){if(token===attempt&&d.fatal)status('HLS.js: '+d.type+' / '+d.details+' – spróbuj trybu natywnego')})}else if(!native&&/\.m3u8/i.test(item.url)){status('HLS.js/MSE niedostępny – przełącz na natywny');return}else{v.src=item.url}var p=v.play();if(p&&p.catch)p.catch(function(){if(token===attempt)status('Jeżeli obraz nie startuje, naciśnij Odtwórz lub zmień tryb.')})}
v.onplaying=function(){status('Odtwarzanie: '+selected.name)};v.onerror=function(){status('Błąd odtwarzania '+(v.error?v.error.code:'')+' – możliwy CORS, format lub niedostępna kamera')};
select.onchange=start;$('play').onclick=start;$('mode').onclick=function(){native=!native;this.textContent='Tryb: '+(native?'natywny':'HLS.js');start()};$('size').onclick=function(){sz=(sz+1)%sizes.length;weather.style.width=sizes[sz]+'%';this.textContent='Pogoda: '+sizes[sz]+'%'};$('toggle').onclick=function(){hidden=!hidden;image()};$('full').onclick=function(){stage.classList.toggle('full');stage.tabIndex=0;stage.focus()};document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.keyCode===461||e.keyCode===10009){stage.classList.remove('full');$('full').focus()}else if(stage.classList.contains('full')&&(e.keyCode===38||e.keyCode===40)){e.preventDefault();select.selectedIndex=(select.selectedIndex+(e.keyCode===40?1:-1)+items.length)%items.length;start()}else if(stage.classList.contains('full')&&e.keyCode===13){stage.classList.remove('full');$('full').focus()}});setInterval(image,600000);
fetch('../../Kamery-pogodowe.m3u8?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(r.status);return r.text()}).then(function(s){var all=parse(s), picks=[function(x){return x.name.toLowerCase()==='chojnice'},function(x){return /odolany/i.test(x.name)},function(x){return /worldcam\.live/i.test(x.url)&&x.logo},function(x){return /webcamera\.pl/i.test(x.url)&&x.logo},function(x){return /ibericam/i.test(x.url)}];picks.forEach(function(f){var x=all.find(f);if(x&&items.indexOf(x)<0)items.push(x)});all.forEach(function(x){if(items.indexOf(x)<0)items.push(x)});items.forEach(function(x,i){var o=document.createElement('option');o.value=i;o.textContent=(i<picks.length?'TEST – ':'')+x.name;select.appendChild(o)});status('Załadowano '+items.length+' kamer. Wybierz kamerę i naciśnij Odtwórz.');if(items.length)start()}).catch(function(e){status('Nie można pobrać playlisty: '+e.message)});
})();
</script></body></html>
